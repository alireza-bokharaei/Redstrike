# OAuth / OIDC Hunting Playbook
#
# Provenance: written for this repository. The referenced upstream catalogue
# (alireza-bokharaei/pentest-agents) carries no licence, so no markdown, prompt or
# data file from it is copied here. What is shared is the *workflow shape*: a named
# hypothesis, a bounded set of observable checks, and a stated refutation.
#
# Scope: every step below is one of the autonomous, in-tree tools
# (tcp_port_probe, http_headers, tls_inspect). Nothing here can call nmap, sqlmap or any approval-gated tool,
# expand scope, raise a budget or confirm a finding.

id: oauth-hunt
name: OAuth / OIDC Hunting Playbook
version: '1.0'
category: web_hunting
description: Redirect-URI validation, state binding and token handling in an authorisation-code flow.
max_steps: 3
expand_wildcard_subdomains: false
steps:
- stage: port_reachability
  tool: tcp_port_probe
  params:
    ports:
    - 80
    - 443
    - 8080
    - 8443
  rationale: Confirm the identity provider surface.
- stage: header_posture
  tool: http_headers
  params:
    method: GET
  rationale: Record the SameSite and cache directives on the callback response.
- stage: transport
  tool: tls_inspect
  params:
    port: 443
  rationale: An identity provider on weak TLS undermines every token it issues.
prioritization_rules:
  missing_hsts_severity: high
  legacy_tls_severity: high
report_focus: Refute when an unregistered redirect URI is rejected, `state` is bound to the session, and
  the code is single-use. A permissive CORS header alone is not an OAuth flaw.
